  body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #root { min-height: 100vh; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 14px; }
</style>
<style id="cn-extra-utils">
  /* Utilities used by the new sections/charts that the pre-built Tailwind
     bundle didn't include. Values match Tailwind defaults. */
  .space-y-2 > :not([hidden]) ~ :not([hidden]) { margin-top: .5rem; }
  .space-y-4 > :not([hidden]) ~ :not([hidden]) { margin-top: 1rem; }
  .gap-10 { gap: 2.5rem; }
  .mt-12 { margin-top: 3rem; }
  .pt-6 { padding-top: 1.5rem; }
  .bg-slate-800 { background-color: #1e293b; }
  .bg-slate-700 { background-color: #334155; }
  .hover\:bg-slate-700:hover { background-color: #334155; }
  .border-slate-700 { border-color: #334155; }
  .border-slate-800 { border-color: #1e293b; }
  .hover\:text-white:hover { color: #fff; }
</style>
<style id="cn-dark-theme">
  /* ── Abuddy dark theme ──────────────────────────────────────────────
     The Tailwind build in this file was compiled without dark: variants,
     so dark mode is applied by re-mapping the utility classes already in
     use whenever <html> carries the .dark class. Nothing above is changed. */
  html.dark { color-scheme: dark; }
  html.dark body { background-color: #0b1220; }

  /* Surfaces */
  html.dark .bg-white { background-color: #131c2b; }
  html.dark .bg-white\/90 { background-color: rgba(19,28,43,.9); }
  html.dark .bg-slate-50 { background-color: #0b1220; }
  html.dark .bg-slate-100 { background-color: #1e293b; }
  html.dark .bg-slate-200 { background-color: #334155; }
  html.dark .bg-slate-900 { background-color: #1b2537; }
  html.dark .bg-slate-900\/60 { background-color: rgba(2,6,23,.72); }
  html.dark .bg-transparent { background-color: transparent; }

  /* Tinted surfaces */
  html.dark .bg-blue-50 { background-color: rgba(59,130,246,.16); }
  html.dark .bg-green-50 { background-color: rgba(34,197,94,.16); }
  html.dark .bg-green-100 { background-color: rgba(34,197,94,.2); }
  html.dark .bg-amber-50 { background-color: rgba(245,158,11,.16); }

  /* Text */
  html.dark .text-slate-900 { color: #e6ebf2; }
  html.dark .text-slate-800 { color: #d5dde8; }
  html.dark .text-slate-700 { color: #c3cddb; }
  html.dark .text-slate-600 { color: #a2aebf; }
  html.dark .text-slate-500 { color: #93a1b3; }
  html.dark .text-slate-400 { color: #76839a; }
  html.dark .text-slate-300 { color: #aab6c6; }
  html.dark .text-blue-600 { color: #7ab0ff; }
  html.dark .text-blue-700 { color: #9cc4ff; }
  html.dark .text-green-500 { color: #4ade80; }
  html.dark .text-green-600 { color: #4ade80; }
  html.dark .text-green-700 { color: #86efac; }
  html.dark .text-amber-600 { color: #fbbf24; }
  html.dark .text-amber-700 { color: #fcd34d; }

  /* Borders */
  html.dark .border-slate-100 { border-color: #22304a; }
  html.dark .border-slate-200 { border-color: #2f3d55; }

  /* Hover states */
  html.dark .hover\:bg-slate-50:hover { background-color: #1b2537; }
  html.dark .hover\:bg-slate-800:hover { background-color: #2b3a52; }
  html.dark .hover\:text-slate-900:hover { color: #f1f5f9; }
  html.dark .hover\:text-slate-700:hover { color: #dbe3ee; }
  html.dark .hover\:text-slate-600:hover { color: #c3cddb; }
  html.dark .hover\:border-blue-200:hover { border-color: #3b62a8; }
  html.dark .hover\:border-blue-400:hover { border-color: #4d7cc9; }

  /* Form controls (inherit white backgrounds by default) */
  html.dark input,
  html.dark select,
  html.dark textarea { background-color: #0f172a; color: #e6ebf2; border-color: #2f3d55; }
  html.dark input::placeholder,
  html.dark textarea::placeholder { color: #6b7A90; }
  html.dark select option { background-color: #131c2b; color: #e6ebf2; }
  html.dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.7); }
  html.dark .bg-slate-50 input,
  html.dark .bg-transparent { background-color: transparent; }

  /* Shadows read better as outlines on dark surfaces */
  html.dark .shadow-sm,
  html.dark .shadow,
  html.dark .shadow-lg,
  html.dark .shadow-xl,
  html.dark .shadow-2xl { box-shadow: 0 1px 2px rgba(0,0,0,.5); }
  html.dark .hover\:shadow-xl:hover { box-shadow: 0 12px 28px -8px rgba(0,0,0,.7); }

  /* Theme toggle button (lives in the top strip) */
  .cn-theme-btn { flex-shrink: 0; }
  .cn-theme-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  html.dark .cn-theme-btn { color: #fcd34d; border-color: #2f3d55; }
  html.dark .cn-theme-btn:hover { color: #fde68a; background-color: #1b2537; }
</style>

<style id="abuddy-visual-v8">
  :root {
    --abuddy-blue: #278AC3;
    --abuddy-blue-dark: #1F73A5;
    --abuddy-blue-soft: #EAF6FC;
    --abuddy-orange: #FB921D;
    --abuddy-orange-dark: #E77D0D;
    --abuddy-ink: #16344D;
    --abuddy-muted: #66798A;
    --abuddy-line: #DDEAF2;
    --abuddy-bg: #F7FBFD;
    --abuddy-shadow: 0 18px 50px rgba(25, 91, 124, .12);
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--abuddy-bg);
    color: var(--abuddy-ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  ::selection { background: rgba(251,146,29,.22); color: var(--abuddy-ink); }

  /* Brand colors: visual-only remap of the existing Tailwind utilities. */
  .bg-blue-600 { background-color: var(--abuddy-blue) !important; }
  .hover\:bg-blue-700:hover { background-color: var(--abuddy-blue-dark) !important; }
  .text-blue-600 { color: var(--abuddy-blue) !important; }
  .text-blue-700 { color: var(--abuddy-blue-dark) !important; }
  .border-blue-600 { border-color: var(--abuddy-blue) !important; }
  .bg-blue-50 { background-color: var(--abuddy-blue-soft) !important; }
  .hover\:border-blue-200:hover { border-color: #9ED2EC !important; }
  .hover\:border-blue-400:hover { border-color: #64B4D8 !important; }
  .hover\:text-blue-700:hover { color: var(--abuddy-blue-dark) !important; }
  .focus\:ring-blue-500:focus { --tw-ring-color: rgba(39,138,195,.32) !important; }

  /* Global surfaces and type rhythm. */
  .text-slate-900 { color: var(--abuddy-ink) !important; }
  .text-slate-800 { color: #27455D !important; }
  .text-slate-700 { color: #3E5B70 !important; }
  .text-slate-600 { color: var(--abuddy-muted) !important; }
  .text-slate-500 { color: #748899 !important; }
  .border-slate-100 { border-color: var(--abuddy-line) !important; }
  .border-slate-200 { border-color: #D5E5EE !important; }

  button, a, input, select, textarea {
    -webkit-tap-highlight-color: transparent;
  }
  button { transition: transform .18s ease, box-shadow .22s ease, background-color .22s ease, border-color .22s ease, color .22s ease; }
  button:active { transform: translateY(1px) scale(.985); }
  a { transition: color .2s ease, opacity .2s ease; }

  header.sticky a[href="#top"] > div:first-child svg { opacity: 0 !important; }
  header.sticky a[href="#top"] > span {
    font-size: 1.06rem !important;
    letter-spacing: -.025em;
    font-weight: 800 !important;
    background: linear-gradient(100deg, var(--abuddy-orange) 0 27%, var(--abuddy-blue) 44% 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
  }
  header nav a { color: #587086 !important; }
  header nav a:hover { color: var(--abuddy-blue-dark) !important; }
  header button.bg-blue-600 { border-radius: 12px !important; box-shadow: 0 10px 22px rgba(39,138,195,.22); }

  /* Landing hero. */
  /* legacy #top hero rules removed — they targeted the old centred hero
     markup and were forcing 86px of top padding, a bottom border and an
     h1 underline onto the current one. */

  /* Featured stays. */
  #rooms { max-width: 1180px !important; padding-top: 72px !important; padding-bottom: 78px !important; }
  #rooms h2 { font-size: 2rem !important; letter-spacing: -.035em; }
  #rooms .grid > .group {
    border-color: #E1EDF3 !important;
    border-radius: 22px !important;
    box-shadow: 0 10px 30px rgba(29,81,108,.07) !important;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease !important;
  }
  #rooms .grid > .group:hover {
    transform: translateY(-7px);
    border-color: #BFDCEB !important;
    box-shadow: 0 20px 40px rgba(29,81,108,.13) !important;
  }
  #rooms .grid > .group img { transition: transform .45s cubic-bezier(.2,.75,.25,1); }
  #rooms .grid > .group:hover img { transform: scale(1.04); }
  #rooms .grid > .group > div:first-child { border-bottom: 1px solid #EDF4F7; }
  #rooms .grid > .group button:last-child { color: var(--abuddy-blue) !important; }

  /* How it works. */
  #rooms + section { background: linear-gradient(180deg, #EEF8FC 0%, #F7FBFD 100%) !important; border-top: 1px solid #E0EEF4; border-bottom: 1px solid #E0EEF4; }
  #rooms + section .grid > div {
    border-color: #DDEBF2 !important;
    border-radius: 22px !important;
    box-shadow: 0 12px 28px rgba(35,91,119,.06);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  #rooms + section .grid > div:hover { transform: translateY(-5px); box-shadow: 0 18px 34px rgba(35,91,119,.1); }
  #rooms + section .grid > div > div:first-child { background: linear-gradient(135deg, var(--abuddy-blue-soft), #FFFFFF) !important; color: var(--abuddy-blue) !important; border: 1px solid #CDE8F4; }

  /* About section. */
  #about { max-width: 1180px !important; padding-top: 76px !important; padding-bottom: 76px !important; }
  #about > div > div:first-child, #about > div > div:last-child { border-radius: 24px !important; border-color: #DCEAF1 !important; }
  #about > div > div:first-child { box-shadow: 0 18px 40px rgba(28,80,107,.07) !important; }
  #about > div > div:last-child { background: linear-gradient(145deg, #F0F9FC, #FFFFFF) !important; }
  #about h2 { letter-spacing: -.035em; }

<style id="abuddy-v16-final-refinement">
  /* ── Featured stays: continuous marquee ─────────────────────────
     The track carries two copies of the card set and slides left by
     exactly one copy, then repeats. --abuddy-marquee-duration is set
     from JS so the travel speed is always 100 px/s. */
  .abuddy-featured-window {
    position: relative;
    overflow: hidden;
    padding: 2px 0 6px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 56px, #000 calc(100% - 56px), transparent 100%);
  }
  .abuddy-featured-track {
    display: flex;
    flex-wrap: nowrap;
    gap: 20px;
    width: max-content;
    will-change: transform;
    animation: abuddy-marquee var(--abuddy-marquee-duration, 60s) linear infinite;
  }
  .abuddy-featured-track > .abuddy-featured-item {
    flex: 0 0 auto;
    width: clamp(258px, 29vw, 352px);

  /* Half the track plus half a gap == one full copy of the card set. */
  @keyframes abuddy-marquee {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(calc(-50% - 10px), 0, 0); }

  .abuddy-featured-window:hover .abuddy-featured-track,

  html.dark #rooms + section { background: linear-gradient(180deg, #0E2532 0%, #0C1E2A 52%, #0B1722 100%) !important; }
  html.dark #locality-explore { background: linear-gradient(180deg, #0B1722 0%, #0E2029 46%, #16202A 100%) !important; }
  html.dark #rooms::before { background: radial-gradient(70% 120% at 50% 0%, rgba(43,139,201,.13), transparent 68%); }
  html.dark footer.bg-slate-900 { background: linear-gradient(160deg, #0A1E2A 0%, #07131B 58%, #0A1C28 100%) !important; }

  @media (max-width: 1000px) { .abh-visual::before { inset: -8% -4%; } }
  @media (max-width: 720px) { .abh-hero::before { display: none; } }
</style>
<style id="abuddy-v19-polish2">
  /* ── Gradients turned up, and carried across the whole page ───────
     Nothing sits on flat white any more: every band, panel and card
     gets a low-contrast wash built from the logo's blue and orange. */

  /* page canvas */
  .abuddy-page {
    background:
      radial-gradient(900px 520px at 100% 0%, rgba(247,148,29,.10), transparent 60%),
      radial-gradient(880px 560px at 0% 12%, rgba(43,139,201,.12), transparent 62%),
      linear-gradient(180deg, #F6FBFE 0%, #FFFFFF 26%, #F7FBFE 58%, #FDF8F2 100%) !important;
  }
  .abuddy-page > header.sticky {
    background: linear-gradient(120deg, rgba(255,255,255,.94), rgba(243,250,254,.92)) !important;
    border-bottom-color: rgba(43,139,201,.16) !important;
  }

  /* hero: stronger mesh */
  section#top.abh-hero { background: transparent !important; border: 0 !important; margin: 0 !important; padding: 0 0 54px !important; max-width: none !important; }
  section#top.abh-hero::before, section#top.abh-hero::after { border-radius: 0; filter: none; }
  section#top.abh-hero > h1::after { content: none !important; }
  .abuddy-page > header.sticky + section#top { margin-top: 0 !important; }
  .abh-glow {
    background:
      radial-gradient(660px 420px at 2% -14%, rgba(43,139,201,.34), transparent 64%),
      radial-gradient(560px 340px at 100% -8%, rgba(247,148,29,.30), transparent 62%),
      radial-gradient(600px 420px at 58% 116%, rgba(43,139,201,.18), transparent 66%),
      radial-gradient(420px 300px at 84% 92%, rgba(247,148,29,.14), transparent 68%) !important;
  }
  .abh-hero::before { opacity: 1; background-image: radial-gradient(rgba(31,124,178,.16) 1px, transparent 1px) !important; }
  .abh-hero::after { content: none; }
  .abh-visual::before { filter: blur(30px); inset: -14% -10% -8% -16%; }

  /* alternating bands */
  #rooms + section {
    background: linear-gradient(180deg, rgba(43,139,201,.09) 0%, rgba(43,139,201,.05) 46%, rgba(247,148,29,.07) 100%) !important;
    border-top: 1px solid rgba(43,139,201,.12); border-bottom: 1px solid rgba(247,148,29,.14);
  }
  #locality-explore {
    background: linear-gradient(180deg, rgba(247,148,29,.08) 0%, rgba(43,139,201,.07) 55%, rgba(43,139,201,.04) 100%) !important;
    border-top: 1px solid rgba(247,148,29,.16); border-bottom: 1px solid rgba(43,139,201,.12);
  }
  #landlord > div {
    background: linear-gradient(135deg, rgba(43,139,201,.16) 0%, rgba(43,139,201,.08) 48%, rgba(247,148,29,.16) 100%) !important;
    border-color: rgba(43,139,201,.22) !important;
  }
  #about > div > div:first-child { background: linear-gradient(150deg, #FFFFFF 0%, #F5FAFD 100%) !important; border-color: rgba(43,139,201,.18) !important; }
  #about > div > div:last-child { background: linear-gradient(150deg, rgba(43,139,201,.10), rgba(247,148,29,.09)) !important; border-color: rgba(43,139,201,.16) !important; }

  /* panels and cards pick up the same wash */
  .abuddy-page .rounded-2xl.bg-white, .abuddy-page .rounded-3xl.bg-white,
  main .bg-white.rounded-2xl, main .bg-white.rounded-3xl {
    background: linear-gradient(155deg, #FFFFFF 0%, #F7FBFE 100%) !important;
  }
  .abuddy-featured-item .bg-white { background: linear-gradient(155deg, #FFFFFF 0%, #F6FBFE 100%) !important; }

  /* dashboards and browse were the flattest surfaces */
  .min-h-screen.bg-slate-50 {
    background:
      radial-gradient(760px 460px at 100% 0%, rgba(247,148,29,.09), transparent 60%),
      radial-gradient(820px 520px at 0% 4%, rgba(43,139,201,.11), transparent 62%),
      linear-gradient(180deg, #F5FAFD 0%, #FAFCFE 48%, #F6FAFD 100%) !important;
  }
  .min-h-screen.bg-slate-50 > header.sticky {
    background: linear-gradient(120deg, rgba(255,255,255,.93), rgba(242,249,254,.9)) !important;
    border-bottom-color: rgba(43,139,201,.16) !important;
  }

  /* auth + role screens */
  .min-h-screen.bg-slate-50.flex {
    background:
      radial-gradient(680px 420px at 6% 0%, rgba(43,139,201,.16), transparent 62%),
      radial-gradient(560px 380px at 96% 100%, rgba(247,148,29,.14), transparent 64%),
      linear-gradient(180deg, #F6FBFE, #FFFFFF 60%, #FDF8F2) !important;
  }

  /* ── dark ─────────────────────────────────────────────────────── */
  html.dark .abuddy-page {
    background:
      radial-gradient(900px 520px at 100% 0%, rgba(247,148,29,.13), transparent 60%),
      radial-gradient(880px 560px at 0% 12%, rgba(43,139,201,.20), transparent 62%),
      linear-gradient(180deg, #0C1A26 0%, #0B1722 34%, #0C1D28 68%, #10202A 100%) !important;
  }
  html.dark .abuddy-page > header.sticky { background: linear-gradient(120deg, rgba(11,23,34,.92), rgba(14,32,44,.9)) !important; border-bottom-color: rgba(99,192,240,.18) !important; }
  html.dark .abh-glow {
    background:
      radial-gradient(660px 420px at 2% -14%, rgba(43,139,201,.40), transparent 64%),
      radial-gradient(560px 340px at 100% -8%, rgba(247,148,29,.24), transparent 62%),
      radial-gradient(600px 420px at 58% 116%, rgba(43,139,201,.22), transparent 66%),
      radial-gradient(420px 300px at 84% 92%, rgba(247,148,29,.12), transparent 68%) !important;
  }
  html.dark .abh-hero::before { background-image: radial-gradient(rgba(127,203,239,.18) 1px, transparent 1px) !important; opacity: .7; }
  html.dark #rooms + section {
    background: linear-gradient(180deg, rgba(43,139,201,.15) 0%, rgba(11,23,34,.4) 52%, rgba(247,148,29,.09) 100%), linear-gradient(180deg, #0E2532, #0B1722) !important;
    border-top-color: rgba(99,192,240,.16); border-bottom-color: rgba(247,148,29,.16);
  }
  html.dark #locality-explore {
    background: linear-gradient(180deg, rgba(247,148,29,.10) 0%, rgba(43,139,201,.12) 55%, rgba(11,23,34,.5) 100%), linear-gradient(180deg, #0E2029, #0B1722) !important;
    border-top-color: rgba(247,148,29,.18); border-bottom-color: rgba(99,192,240,.14);
  }
  html.dark #landlord > div { background: linear-gradient(135deg, rgba(43,139,201,.22) 0%, rgba(14,32,44,.9) 50%, rgba(247,148,29,.16) 100%) !important; border-color: rgba(99,192,240,.22) !important; }
  html.dark #about > div > div:first-child { background: linear-gradient(150deg, #12222E 0%, #0E1D28 100%) !important; border-color: rgba(99,192,240,.16) !important; }
  html.dark #about > div > div:last-child { background: linear-gradient(150deg, rgba(43,139,201,.16), rgba(247,148,29,.12)) !important; border-color: rgba(99,192,240,.16) !important; }
  html.dark .abuddy-page .rounded-2xl.bg-white, html.dark .abuddy-page .rounded-3xl.bg-white,
  html.dark main .bg-white.rounded-2xl, html.dark main .bg-white.rounded-3xl,
  html.dark .abuddy-featured-item .bg-white {
    background: linear-gradient(155deg, #142330 0%, #101C26 100%) !important;
  }
  html.dark .min-h-screen.bg-slate-50 {
    background:
      radial-gradient(760px 460px at 100% 0%, rgba(247,148,29,.11), transparent 60%),
      radial-gradient(820px 520px at 0% 4%, rgba(43,139,201,.18), transparent 62%),
      linear-gradient(180deg, #0C1A26 0%, #0B1722 50%, #0D1E29 100%) !important;
  }
  html.dark .min-h-screen.bg-slate-50 > header.sticky { background: linear-gradient(120deg, rgba(11,23,34,.92), rgba(14,32,44,.9)) !important; border-bottom-color: rgba(99,192,240,.18) !important; }
  html.dark .min-h-screen.bg-slate-50.flex {
    background:
      radial-gradient(680px 420px at 6% 0%, rgba(43,139,201,.24), transparent 62%),
      radial-gradient(560px 380px at 96% 100%, rgba(247,148,29,.16), transparent 64%),
      linear-gradient(180deg, #0C1A26, #0B1722 60%, #10202A) !important;
  }
</style>

<script>
/* ── Abuddy theme init ─────────────────────────────────────────
   Applies the saved theme (or the OS preference) before the app paints.
   The toggle control itself lives in the header strip, rendered by React. */
(function () {
  var saved = null;
  try { saved = window.localStorage.getItem("abuddy-theme"); } catch (e) {}
  var dark = saved === "dark" || (saved !== "light" &&
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
})();
</script>
